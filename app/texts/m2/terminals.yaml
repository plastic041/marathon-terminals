                  text: |-
                    $C5   “Gee, and I still didn’t have to make a level…"

                       Here’s to cooperative net play, terminals, and Vulcan2.  Heh.

                       Thanks to all those folks that put up with me while I was working on this.  Especially Nicole for understanding the long hours and summers in Chicago.  Now I just have to graduate in December…

                       Thanks to the Gang (Jake, John, Pagan, Adam, and Mike) for keeping me sane.

                       And of course, thanks to my parents for understanding when their son goes off into the Code Mines of Moria for months while working on $IMarathon$i & $IMarathon 2.$i

                       We Rule.
                       -Ryan
                - type: briefing
                  pict: 11102
                  image: images/PICT_11102.png
                  text: |-
                    A wise Nar once said “A Nebulon under the foot is worth two behind a plasma cannon,” but the Nar are still waiting for their mythical savior with green pee to fly their coal-powered interstellar battlewagons to glory against the Nebulons.  Those are Nebulons under Tfear’s feet, by the way.  Seems nobody likes the Nebulons.

                    If I ever texture-map another axis-aligned polygon, it’ll be too soon.  I’m real sorry for being Blake, and I hope $IAll Roads Lead To Sol$i atones for the grievous sin of $IColony Ship For Sale$i.

                    The Nar, who speak entirely in metaphor, call Chicago “the limitless, unforgiving sky; the prison which will forever watch over our graves” in the winter.  Too bad it’s winter.

                    Jason              Sunday, November 5, 1995
                - type: briefing
                  pict: 10502
                  image: images/PICT_10502.png
                  text: |-
                    $C5Some people don’t realize that I provided not only the voices and screams for the Bobs, but also modeled for the artists as they were working on the assimilated ones.  Like them, I have two toes, red eyes, snaggle teeth and no genitals.

                    I was a little shy about it at first (you can imagine the jokes!), but it's all a part of the Bungie spirit of going all out to satisfy the customer.

                    So next time you're at a convention with us, instead of asking me to do Bob’s flaming death scream for the umpteeth time, ask to see my..... eyes.  We’ll all have a good laugh.

                    Doug.
                - type: briefing
                  pict: 12601
                  image: images/PICT_12601.png
                  text: |-
                    $C2Peace, found as a solitary runner on a straight, long path.  Living the pain, not waiting for it to pass.  Living the pain; feeling it, accepting it, using it.  

                    Control, over self, thought, action.  Doing the right thing.  Speaking the truth.  Accepting no limitations.

                    Peace with family found as an individual.  No longer depending on environment for identity.  Giving as much as taking.  Clear ambitions.  Love and purpose balanced.

                    Alex.
