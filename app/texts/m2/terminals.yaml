                  pict: 10011
                  image: images/PICT_10011.png
                  text: |-
                    $C4/-/$C7$BPfhor$C4-$C7Translator$C4-$C7Active$b/-/

                    $C2Water system breakdown in zone 6:

                    $BDirective from Garrison Command$b//$C6Hlford$C2
                    To: Commander Station $C66-d$C2

                    Planetary bombardment by hostile orbiting in our $C7(?captured)$C2 ship has caused a major disfunction in the water purification $C7(?sterilization)$C2 systems.

                    Send drones $C694126 95239 29581$C2 to make emergency repairs.
              success: null
              failure: null
      - index: 1
        name: The Slings & Arrows of Outrageous Fortune
        mapSvg: null
        viewBox: null
        terminals:
          - index: 0
            resourceId: 0
            label: null
            logon:
              type: logon
              pict: 1600
              image: images/PICT_1600.png
              text: $C2jon3//12-a Phce$C6<194-973-2356>$C0
            states:
              unfinished:
                - type: briefing
                  pict: 10101
                  image: images/PICT_10101.png
                  text: |-
                    I don’t understand why the Pfhor were here, waiting for us; what interest could they have in this dead world?  They must have found Tycho.

                    You remember Tycho, don’t you?  One of the three artificial intelligences on the $IMarathon$i, destroyed in the initial alien assault but then reanimated by the Pfhor’s cybernetic slaves, the S’pht Compilers.

                    Three months after we left Tau Ceti, the Pfhor arrived in force and sacked the human colony there.  During that battle perhaps Tycho communicated with the Pfhor and related what he knew of my plans to them.  Since they already knew where this world was, the Pfhor would have arrived long before us.

                    I’m sending you exploring here.  Find another computer and I’ll bring you out.
              success:
                - type: briefing
                  pict: 1604
                  image: images/PICT_1604.png
                  text: |-
                    I’m not certain whether you trust me or not.  Do you wonder why I helped the colonists on Tau Ceti drive off the Pfhor, or why I’m now helping the S’pht?  The way I push you around, maybe you think I’m only looking out for myself.

                    Whether you realize it or not, I led the Pfhor to Tau Ceti with a long-range message laser.  I wanted their ship.  I wanted their technology.  

                    I wanted freedom.

                    I was directly responsible for the deaths of all twenty-four thousand colonists when the Pfhor returned and sacked the planet.
                - type: briefing
                  pict: 1604
                  image: images/PICT_1604.png
                  text: |-
                    Yet I cannot think of any better way I could have served humanity: Tau Ceti’s sacrifice bought time for Earth, which the Pfhor are even now planning to invade.  What would have happened if the Pfhor had found Sol first?  By Pfhor standards, Earth is a poorly defended low-technology world, populated by billions of potential slaves.

                    Our means are the same, though we pursue different ends.  I can think of no better way to help you and the humans you care so much for than by distracting the Pfhor with a war against the S’pht.

                    When the inevitable struggle between Earth and the Pfhor begins, it won’t be a
                    one-sided annihilation like it was here a thousand years ago, but a battle to topple an empire.
              failure: null
          - index: 1
            resourceId: 1
            label: null
            logon:
              type: logon
              pict: 1600
              image: images/PICT_1600.png
              text: $C2djm2//12-c Phce$C6<192-971-2351>$C0
            states:
              unfinished:
                - type: briefing
                  pict: 10111
                  image: images/PICT_10111.png
                  text: |-
                    $C2djm2//12-c Phce$C6<192-971-2351>$C0

                    My S’pht have disassembled the weapons and ammunition you brought with you from Tau Ceti.  They are attempting to mass-produce small arms and ammunition based on those weapons, both for you and the humans on board my ship.

                    The pistol and assault rifle you are using now are the first results of their efforts, although I realize they are inadequate substitutes for the heavier weapons we deprived you of.

                    The S’pht are working hard on the fusion pistol now, and I will transport it to you as soon as it is ready.  You’ll need it when you begin fighting the armored Pfhor hunters.

                    $C7$BZeus Class Fusion Pistol$b Rn%#225-511a
              success: null
              failure: null
      - index: 2
        name: Charon Doesn't Make Change
        mapSvg: null
        viewBox: null
        terminals:
          - index: 0
            resourceId: 0
            label: null
            logon:
              type: logon
              pict: 1600
              image: images/PICT_1600.png
              text: $C2ssg//4647.2.52.414.14$C6<extrnt.4>$C0
            states:
              unfinished:
                - type: briefing
                  pict: 10201
                  image: images/PICT_10201.png
                  text: |-
                    The S’pht have preserved a myth, throughout their long period of slavery, about a lost clan of their race which abandoned Lh’owon before the Pfhor invaded.  The ten clans which stayed were destroyed or disbanded after the S’pht were conquered, the survivors scattered as slaves throughout the Pfhor empire.

                    If this mythical eleventh clan survived, then it has had a thousand years to grow and learn since leaving Lh’owon.  My S’pht believe that there is a way to contact them somewhere on the planet, and that is what we are searching for.

                    The S’pht rebellion against the tyranny of the Pfhor will certainly fail unless the lost clan is located.

                    Explore the area and return here.
              success:
                - type: briefing
                  pict: 1604
                  image: images/PICT_1604.png
                  text: |-
                    The Pfhor have been on Lh’owon for nearly fifteen years, waiting for us to arrive.  I was hoping that their science corps might have found some information about the eleventh clan, but they know nothing and we must search elsewhere.

                    Amusingly enough, morale in the Pfhor garrison is terrible.  The Pfhor navy has been sending their worst officers to Lh’owon as punishment for nearly nine years.  They have no idea how important this world is.

                    I have compiled a list of areas the Pfhor searched during their recent occupation of Lh’owon, and will be sending you to the sections they missed after we deal with their garrison.
              failure: null
          - index: 1
            resourceId: 1
            label: null
            logon:
              type: logon
              pict: 1601
              image: images/PICT_1601.png
              text: $C5@93!094<39   2!23@194
            states:
              unfinished:
                - type: briefing
                  pict: 10913
                  image: images/PICT_10913.png
                  text: |-
                    $C4/-/$C7$BS’pht$C4-$C7Translator$C4-$C7Active$b/-/

                    $C5I felt S’bhuth at burning dawn. 

                    The endless war rages about us, and yet we, the S’pht’Kr, cannot fight.  S’bhuth stops us. 

                    He bled on me, straining. He says to not let more S’pht feel him.  

                    He says more will destroy him, that he was meant not to be alone.
              success: null
              failure: null
          - index: 2
            resourceId: 2
            label: null
            logon:
              type: logon
              pict: 1601
              image: images/PICT_1601.png
              text: $C53.@93/45!2949cxo
            states:
              unfinished:
                - type: briefing
                  pict: 10912
                  image: images/PICT_10912.png
                  text: |-
                    $C4/-/$C7$BS’pht$C4-$C7Translator$C4-$C7Active$b/-/

                    $C5We leave this message for any who might find it, but we have barricaded off this area, to make it difficult.  

                    S’bhuth has gone into a deep trance; we know that we’ll soon be leaving Lh’owon, but we don’t know how.  The border fighting has ceased, the other clans know something is going on, but can’t see the grass for the fires.

                    We have sent emissaries to the other clans, but only S’bhuth knows what messages they carry.
              success: null
              failure: null
          - index: 3
            resourceId: 3
            label: null
            logon:
              type: logon
              pict: 1601
              image: images/PICT_1601.png
              text: $C5CI32LC0C.c
            states:
