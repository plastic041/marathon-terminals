                    $C4$BReport from Science Manager 7$C2$b
                    $C6ZONE 29-s$C2 [Lh’owon Garrison]

                    We have explored many of the surrounding caves, but continually find the combative creatures the S’pht call F’lickta.  Archeological evidence suggests that this was once a center of S’pht life, though it appears to have been abandoned after an ancient battle. 

                    The quality of the machinery is quite extraordinary, and most of the computer terminals are still functional even after two thousand years.
