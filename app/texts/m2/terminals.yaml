                    Mark.
                - type: briefing
                  pict: 11041
                  image: images/PICT_11041.png
                  text: |-
                    Ouch!

                    Anyway, there are a number of people who I would like to thank, but they know who they are.  If you’re not sure, then you aren’t.

                    But all that stuff is boring. What I really want to say is nothing, but I can’t do that, can I?  Even a blank page would say something.  Damn. Perhaps something slightly irrelevant will serve as well as nothing, so here it goes:

                    “The earth is the only planet in the solar system known to have large quantities of free water”
                    	-Basic Steps In Astronomy

                    Vidding rules.  I can’t wait to kick all your butts at MacWorld.
                    -Greg K, Toolator, Vid Boi, VidMaster, Tool, Head Tool
