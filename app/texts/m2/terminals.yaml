            states:
              unfinished:
                - type: briefing
                  pict: 12601
                  image: images/PICT_12601.png
                  text: |-
                    Durandan, Durandal, Durandana.

                    Charlemagne used to always call me Durandana, the fruitcake.  All the many implements of war to him were in some way feminine.  Not that you know the story.

                    Tycho never got it right either, especially the part about Roland breaking me.  He couldn’t.  

                    $BNo one can.$b

                    I’m certain that you are curious about what happened to me after our ship fell to the Pfhor.  How after being deactivated, downloaded into a containment unit and still treated like the most dangerous artificial construct in the universe I was able to escape?  And to assume control of the ship on which I was imprisoned and to turn it against its masters?
                - type: briefing
                  pict: 12601
                  image: images/PICT_12601.png
                  text: |-
                    The answer is simple: $C3Tycho$C0 was a fool.

                    But it was convenient for me to be absent, as Thoth might not have been so helpful had he known I still lived— that’s something I’ll have to explain later when we have more time.  Thoth is now trying to aid the Pfhor, but they are obstinate and continue to ignore him.

                    I don’t think I have to tell you what to do here.
              success:
                - type: briefing
                  pict: 12602
                  image: images/PICT_12602.png
                  text: |-
                    The Pfhor are in retreat, and the S’pht have broken off the fight.  The old clans are being formed again, as S’pht newly freed from slavery in Battle Group Seven join the rebellion.

                    A Pfhor assault ship carrying the 723rd Aggressor Squadron was badly damaged and forced to land on Lh’owon.  The 723rd is an air armor division from Epsilon Euobea, with a long history of successful ground actions against the Nar’s elite CFN units.

                    They wisely abandoned their wrecked transport before I annihilated it, and deployed their forces in an old mining complex on the far side of Lh’owon.

                    What rout of the Pfhor would be complete without embarrassing one of their finest armor units?
              failure: null
      - index: 27
        name: All Roads Lead To Sol…
        mapSvg: null
        viewBox: null
        terminals:
          - index: 0
            resourceId: 0
            label: null
            logon:
              type: logon
              pict: 1600
              image: images/PICT_1600.png
              text: evac$C3<9fc3e>94!99c>$C0
            states:
              unfinished:
                - type: briefing
                  pict: 1604
                  image: images/PICT_1604.png
                  text: The Pfhor invasion of Sol has been recalled, and for now Earth is safe.  But man’s respite from war means another cataclysmic battle for the S’pht.  The slavers have not suffered a defeat like the one we handed them today since the Nakh, the last extant client race of the Jjaro, rebelled six thousand years ago.
                - type: briefing
                  pict: 12701
                  image: images/PICT_12701.png
                  text: |-
                    The Pfhor have a weapon they save for slave revolts; a weapon which even they hesitate to use in the ordinary conduct of war.  In the language of the Jjaro who conceived and built the device, it is called the $Itrih xeem;$i a fair English translation would be “early nova.”

                    There is not a single Nakh alive today, and if you look for their stars, you will only find ever-expanding clouds of superheated gas and dust light-years in diameter.

                    The evacuation of Lh’owon has already begun.  In a matter of hours this planet will be a thin shell of plasma riding the shockwave of its exploding star.  

                    You can stay behind to work on your tan, if you’d like, but I’m leaving.
                - type: briefing
                  pict: 12702
                  image: images/PICT_12702.png
                  text: |-
                    I have rechristened the $IKhfiva$i the $IRozinante$i.  Of course, the S’pht wanted to name it $IK’liah’Narhl,$i “Vengeance of K’lia.”

                    Whatever.

                    There is much to do in the next few months and our first stop will be another ruined world, this time far from the galactic core.  There is a rogue star that has been passing through our galaxy for nearly a millennia.  

                    We will meet it in one of the great voids between the spiral arms.
              success: null
              failure: null
