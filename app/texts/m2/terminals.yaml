                - type: briefing
                  pict: 1604
                  image: images/PICT_1604.png
                  text: |-
                    $C2<CMND OVERRIDE $U&@85f2$u>


                    $C0Sorry about the lava bath, but there was no other way.  When the safeties disengaged, the lava on the surface poured through the drains into the basement, burying the main Pfhor power station on Lh’owon.

                    Hlford will be taking cold showers until he gets that fixed.

                    Anyway, Robert Blake and his men need your help clearing out the few Pfhor that managed to escape the flooding of their basement.  Blake is the populist leader of the colonists, but your paths never crossed on Tau Ceti.

                    Return here when the area is secure.
              success:
                - type: success
                  text: $C2
                - type: briefing
                  pict: 10321
