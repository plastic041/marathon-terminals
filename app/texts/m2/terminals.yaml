                  pict: 11901
                  image: images/PICT_11901.png
                  text: |-
                    Nice job.

                    Everyone is talking about your exploits on Tau Ceti during the Pfhor invasion seventeen years ago.  During those two days I remember hearing the crew talking about a single man, standing alone against the invaders, but I had no idea that it was only through your efforts that the $IMarathon$i and perhaps Tau Ceti itself were saved.

                    I never saw you then, but maybe I’ll get a chance to meet you when this is all over.  There’s one more activation site.

                    Good luck.
