                  pict: 10701
                  image: images/PICT_10701.png
                  text: $C2"Nuts to this", screamed Robert - his normally Hyper Good Samaratain (HGS) surface personality disolving into a pool of dull-red hatred surmounted by white-hot ball of rage.  "My faith in you has finally killed me!"  And it was true, at that very moment his heart stopped beating and his brain, throbbing with anger and disgust, took over.  He vomited all of the wholesomeness he could fit through his mouth in one fiften (15) second cataclysmic eruption leaving naught but revulsion and despair behind.  Though possessing a powerful build (being constructed mainly of horseflesh and pigiron), his bones seemed weak in comparison to his newfound desire to kill.  And kill he would, scores of dead would pile up beneath his feet.  And he would say, "...It was a case of post-mortem self-defense!"
                - type: briefing
                  pict: 10201
                  image: images/PICT_10201.png
                  text: |-
                    $C5I would like to thank my family and friends for all the support they have given me. I'd also like to thank all my coworkers at Bungie (Ωµ∑˙®¨œ∆ø˜ø∆) for making this the coolest company to play at!

