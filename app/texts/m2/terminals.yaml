                  pict: 10911
                  image: images/PICT_10911.png
                  text: |-
                    $C4/-/$C7$BS’pht$C4-$C7Translator$C4-$C7Active$b/-/

                    $C5We are leaving behind many F’lickta to keep the ducts clean and working.  They should be able to build one of their stable societies here— there is plenty of food.  

                    We would ask that if another clan comes here that they would respect these creatures and leave them to continue their work and preserve our home on Lh'owon.
              success: null
              failure: null
