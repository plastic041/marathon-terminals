                  pict: 12511
                  image: images/PICT_12511.png
                  text: |-
                    $C3Robert Blake left something for you a few minutes ago.  He and the other humans captured a Pfhor refueling ship and found or forced someone to pilot it for them.  They folded out of the system immediately after I received the message, without so much as a “Thanks for saving us from becoming plasma on Tau Ceti, Durandal.”

                    Anyway, the message reads: “The dead walk again; we cannot wait.  —Blake.”  I think he means me, but I let him go anyway.

                    Good-byes were always hard for me.  You know I’ll never let you go.

                    But now is no time to get sentimental about my resurrection; dry those tears and stuff a fresh clip in your assault rifle.  The Pfhor down on the planet are not defeated yet.
