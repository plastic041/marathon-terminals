                    **수신 메시지**

                    게릿 화이트는 바닥으로부터 삼 피트 공중에 떠 있었다. 삼 주째였다. 손과 발은 따끔거렸고, 눈은 죽어가는 불로 달궈졌다. 그에게 누군가 마지막으로 말을 건넨 것은 감방 문이 큰 소리로 닫혔을 때뿐이었다. 그때 제복을 입은 남자가 무엇을 말했는지는 기억나지 않았다. 감방의 쇠창살에 튕겨 나온 말들이 게릿의 귓가에 맴돌았다. 게릿은 붙잡혔다는 등, 지난 몇 분간 혼잣말을 했다. 곧 귀가 따끔거리기 시작했다.

                    그는 자신의 손을 내려다보았으나, 눈이 달궈진 탓에 눈을 감을 수밖에 없었다. 눈물이 흘렀다. 이윽고 눈을 뜨자, 살덩어리의 반죽으로 녹아내린 그의 손은 눈 속 불길로 흐르는 잔물결 속에서 일렁이고 있었다.

                    "망할 감방." 누군가 말했다. "제대로 된 식사를 해본 게 삼 일 전이야. 이딴 걸 먹으면 실험실 쥐라도 죽을걸."

                    쥐. 쥐에 관한 기억이 있었다. 하지만 귀가 다시 윙윙대기 시작했고, 그에게 말을 걸던 목소리는 마음속 배경음으로 희미해져 갔다. 그 자리에 새로운 소리가 들려왔다. 박수 소리였다. 그는 다시 손을 만들어내기 위해 눈을 질끈 감았다. 눈을 뜨니 손이 사라져 있었다. 양팔이 서로의 손목으로 이어져 있었다.

                    연못에 얼음 썰매를 타러 간 적이 있었다. 얼음 위를 스치는 썰매 소리, 부드럽게 갈리는 소리가 떠올랐다. 이제 그 소리는 그의 귓속에서 울리며 생각들을 무너뜨리고 있었다. 손에 흰 토시를 낀 여자가 있었다. 지금의 게릿과 같은 손목을 갖고 있었다. 박수를 너무 많이 치려고 했던 사람의 팔. 살면서 그는 다른 모두에게 박수갈채를 보냈다. 자신만 제외하고. 자신과 마찬가지로, 그 손들도 감옥에 갇혔다. 그는 이유를 알지 못했다.

                    "여기선 잠에 들 수가 없어. 퀴퀴한 침낭의 역겨운 냄새를 맡지 못한다 해도, 벽 속을 갉는 쥐들의 소리에 잠을 설쳐. 꿈조차 꿀 수 없어. 그놈들이 나를 갉아먹는 게 아닐까 하는 생각이 들 정도야..."  목소리는 감방 내부에서 들려왔지만, 게릿은 아무도 볼 수 없었다.

                    게릿이 항상 혼자였던 것은 아니었다. 그는 부서진 마음 어딘가에서 그의 친구와 연인과 살인자들의 희미한 흔적을 발견했다.

                    피바다를 벌이며 학교에서 싸운 날 생각한 이론이 있었다. 간단한 이론이었다. 어느 누구나 인생에서 적어도 한 번은 살인자가 된다는 것이었다. 죄책감에 관계없이, 사람은 누구든 누군가가 죽기를 바란다. 증오. 증오를 이해하지 못하는 사람은 없다. 게릿은 그 운동장에서 증오를 알게 되었다. 그를 때린 사람은 피범벅이 된 얼굴을 보며 웃었고, 이제 그 웃음소리가 게릿의 귀에 메아리쳤다. 감방 안의 소리가 들리지 않을 정도로.

                    운동장은 보통 게릿과 그의 친구들이 미식축구나 공놀이를 하며 노는 곳이었지만, 오늘은 긴장감이 서려 있었다. 다들 상하기 직전의 우유에 시리얼을 말아 먹었거나, 아니면 타이어 덮개 공장에서 나온 연기에 취했기 때문이리라. 미식축구는 몹시도 거칠었다. 게릿은 친구도 아닌 소년 다섯에게 각각 밀쳐진 뒤, 오늘은 공놀이나 하기로 마음먹었다. 하지만 그조차도 끔찍했다. 한 아이가 다른 아이를 줄곧 놀려댔다. 오늘은 끔찍한 날이었다. 그의 옆에 선 소년이 그를 밀치기 시작하자 그는 폭발했다. 눈에서 증오가 흘러넘쳤고, 손과 발이 따끔거리기 시작했다. 그는 몸을 가눌 수가 없었다. 그는 얼굴이 피투성이가 될 때까지 구타당했다. 뒤늦게 도착한 운동장 담당 교사는 별일 아니라는 태도였다.

                    게릿은 할 수만 있었다면 그를 죽였을 것이다. 자신을 때린 소년의 눈을 뽑아버렸을 것이다. 그 고통의 대가를 치르게 했을 것이다. 그러나 손이 따끔거리기 시작했다. 그는 발의 감각을 느낄 수가 없었고 곧 땅에서 떠오르기 시작했다.

                    모두가 살인자였지만 게릿은 왜 그렇게 생각했는지 기억해낼 수 없었다. 손, 즉 정의에 대한 열망과 관련있는 무엇일 거라고 짐작할 뿐이었다. 손과 발이 따끔거리기 시작했고, 바닥이 더욱 멀어졌다. 그는 손으로부터 고개를 들었다. 감방의 쇠창살이 마치 해변의 파도와 같이 좌우로 요동치며 넓게 열렸다가 굳게 닫히기를 반복했다. 아무 문제 없을 거라고 안심할 때마다 창살은 솟아올랐고, 열린 틈은 닫혔으며, 파도는 올랐다가 무너졌다. 결과는 똑같을 것이다. 그는 탈출할 수 없다. 그는 창살에 짓눌리고 부러질 것이다.

                    그러나 파도의 움직임에도 불구하고, 그는 해저에 평온하게 내려앉은 손바닥 아래의 거친 모래를 느낄 수 있었다. 그의 몸은 거칠고 안전한 모래를 느끼는 손을 축으로 이리저리 흔들리고 뒤집혔다. 파도가 마지막으로 한 번 부서지자 그는 거꾸로 착지했다. 그의 손은 모래바닥에서 튕겨 나갔고, 쏟아지는 물살이 그의 귀와, 그의 코와, 그의 입을 채웠다. 부서지는 물소리가 발끝부터 머리까지 폭포수처럼 쏟아져 내려 그의 마음을 꿰뚫고 생각을 무너뜨렸다. 파도에 맞선 모래성처럼, 생각들이 무너져내렸다.

                    게릿은 좋은 삶을 살았다. 아주 오랫동안, 아주 오랫동안. 그는 수영을, 도는 것을, 때리는 것을 사랑했다. 그는 손과 발의 따끔거림을, 적을 죽일 수 없는 스스로의 무능을 사랑했다. 언젠가 계단에서 굴러떨어진 적이 있었다. 아주 잠깐, 그의 손이 계단에 깔린 융단에 닿았다. 순간 그의 몸이 멈춘 채 계단 위로 떠올라 추락하지 않았다. 그러나 그 순간은 오래가지 않았다. 바다가 그의 주위로 부서졌고 손은 모래바닥에서 뜯겨 나갔으며 몸은 뒤집히고 추락했다.

                    하지만 이제 그는 더욱 높이 떠올랐고, 손은 여전히 따끔거렸다. 게릿은 쇠창살 사이로 떠오르고 있었다. 그는 손디딜 곳을 찾으며 안전의 순간이 오기를 바랐으나 그런 순간은 오지 않았다. 쇠창살이 그의 몸을 조였다. 가슴이 따끔거렸다. 새장 사이로 추락하는 그의 다리가 따끔거렸다. 눈을 달구는 불길은 차가운 바람이 되었다. 그는 눈을 깜빡여 눈물을 떨쳐냈다. 쇠창살 사이로 구르던 그는 한 남자를 보았다. 남자는 손에 작고 하얀 쥐를 들고 있었다. 쿵, 파도가 부서지는 소리가 박자에 맞게 귓가에 울렸다. 남자는 쥐를 바닥에 내리치고 있었다. 쿵, 쿵. 손이 피투성이가 되었다. 남자의 손이 따끔거렸다. 남자는 감방 바닥에 부러뜨렸다. 교사, 연인, 살인자를. 게릿은 감방을 돌아보았다. 그는 자기 자신과 교사, 연인, 살인자를 보았다. 그는 적을 죽였다. 피투성이 손 안에 죽은 쥐. 마침내, 그는 자신을 때린 자의 목을 쥐었다.

                    그는 파도 속으로 탈출했다.

                    파도 속으로.

