                  text: |-
                    ***릴라가 전송한 메시지***

                    행성의 여러 식민지민들과 연락했으나, 서로 모순되고 명백히 과장된 보고들이 전송되고 있습니다. 주요 중거리 무선 안테나가 무력화 혹은 파괴되어 틍신 상태가 매우 나쁩니다.

                    하나 확실한 것은 마라톤 호 공격이 시작된 지 몇 분 만에 저위력 핵무기로 우주 공항이 완전히 파괴되었다는 점입니다. 이 사실은 제 광학 기기로 직접 확인했습니다.

                    침략자들은 우선 식민지보다는 마라톤 호에 더 관심이 있는 것으로 보입니다. 그러나 명확한 공격 동기는 아직 파악하지 못했습니다.
