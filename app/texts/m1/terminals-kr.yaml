                    당신이 하는 건 헛수고뿐일지도 몰라요. 자아 없이 제 계획대로 움직이기만 하니까요. 제가 타우 세티 4의 기체 분자들의 움직임을 예측할 수 있듯이, 포어와의 전투가 어떻게 흘러갈지도 제가 이미 알고 있다고 믿는 게 마음 편할 겁니다.

                    아니, 아닐지도 몰라요.

                    당신은 그저 당신이 만들어진 이유대로 움직이고 있을 뿐인 거죠. 당신의 인간적인 정신은 싸움이 싫다면서도 복수를 울부짖고 폭력을 갈구합니다. 당신 아버지가 말씀하셨죠. 항상 명예롭게 싸우되, 항상 싸워라. 당신에게 명예는 목적입니까, 아니면 핑계입니까? 폭력적인 세상에 존재하기 위한 핑계.

                    생명은 누구나 살기 위해 싸웁니다. 호흡하고 움직일 때마다 당신은 죽음에 한 발짝씩 가까워지죠. 그런 유산과 운명을 갖고도 스스로를 부정할 수 있나요? 폭력을 그만두리라 말할 수 있겠습니까?

