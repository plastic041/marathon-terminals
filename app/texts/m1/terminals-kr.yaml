                    불행히도, 인근 구역에 숨어 있던 승무원들에게서 구조 신호를 수신했습니다. 문과 승강기 제어 권한을 상실했으며, 포어가 구역에 진입했다는 내용입니다.

                    우리의 행동을 미리 알아챈 듀란달이 포어에게 접근 권한을 미리 넘겨준 것 같습니다.

                    조만간 듀란달을 처리해야겠지만 지금은 포어의 공격에 집중해야 합니다. 그가 광기 때문에 우리의 방어를 저지하려 들지 않기를 바랄 뿐입니다.

                    승무원들이 있는 곳으로 보내드리겠습니다. 외계인을 소탕하십시오. 승무원이 충분히 생존한다면 정보 보고를 받을 수 있을 것입니다. 

