                  text: |-
                    ***릴라가 전송한 메시지***

                    마라톤의 자동 방어 체계는 공격 초기에 지향성 자기 펄스에 의해 무력화되었습니다. 외계인은 같은 무기를 사용해 마라톤 호의 다른 AI, 듀란달과 타이코를 무력화시켰고 저에게도 심각한 손상을 입혔습니다.

                    듀란달은 문, 생명 유지 장치, 부엌, 공기 재생기, 계단 등 마라톤 호의 자율 기능 제어를 담당합니다. 그가 동작하지 않으므로 제가 그의 기능을 대신하기 위해 노력하고 있습니다. 타이코는 과학과 기술 시설 제어를 담당합니다.

                    필요한 무장을 갖추었으니, 우리의 최우선 과제는 제가 제어할 수 있도록 마라톤 호의 방어 체계를 재가동해 외계인에 저항하는 것입니다. 방어 체계를 수리할 교체용 회로 기판을 세 개 제작했지만, 당신의 도움 없이는 제조 시설에서 가져올 수 없습니다.

                    교체 부품을 회수할 곳으로 당신을 전송하겠습니다. 도착하면 추가 지침을 드리겠습니다.

                    ***메시지 종료***

                    $B***도약 발판 활성화 개시***
                    $B***전송 준비 완료***
