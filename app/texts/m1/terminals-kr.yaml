                  text: |-
                    ***릴라가 전송한 메시지***

                    지금까지 파악한 바로는 외계인의 습격은 비교적 조직적이지 않은 것으로 보입니다. 마라톤 호의 거대한 크기 탓으로 추측됩니다.

                    그러나 외계인의 습격은 무질서한 반면, 네트워크에 대한 공격은 매우 효과적입니다. 마라톤 호의 대부분의 컴퓨터 시스템에 보안 침해가 감지되고 있습니다. 인류의 컴퓨터 시스템에 접속할 수 있는 외계 생명체가 있는 것으로 보입니다.

                    발견하는 즉시 이 생명체들을 죽이십시오. 그들을 막는 것이 최우선입니다. 지금 이 순간에도 적이 제 방어망을 뚫고 들어오고 있습니다.

                    당장 순간 이동하십시오.

                    ***메시지 종료***


                    $B***도약 발판 활성화 개시***
                    $B***전송 준비 완료***
